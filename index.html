<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  
  <title>Presentation Deck</title>
  <meta name="description" content="View our presentation deck." />

  <!-- Open Graph / Social Media Preview -->
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://deck.domain.com" />
  <meta property="og:title" content="SHOGI Systems, Inc. 8-Slide Deck" />
  <meta property="og:description" content="Click to view the presentation deck." />

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #1a1a1a;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    /* Embedded PDF container */
    #pdf-container {
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
    }

    iframe {
      width: 100%;
      height: 100%;
      border: none;
      flex: 1;
    }

    /* Mobile / Fallback Overlay */
    .mobile-fallback {
      display: none;
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: #121212;
      color: #ffffff;
      padding: 32px 24px;
      text-align: center;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 10;
    }

    .mobile-fallback h1 {
      font-size: 1.5rem;
      font-weight: 600;
      margin-bottom: 12px;
    }

    .mobile-fallback p {
      font-size: 0.95rem;
      color: #a0a0a0;
      margin-bottom: 28px;
      max-width: 320px;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background-color: #0070f3;
      color: #ffffff;
      font-weight: 500;
      font-size: 1rem;
      padding: 14px 28px;
      border-radius: 8px;
      text-decoration: none;
      transition: background-color 0.2s ease;
      box-shadow: 0 4px 14px rgba(0, 118, 243, 0.39);
    }

    .btn:hover {
      background-color: #0051b3;
    }

    /* Show mobile fallback on small touch devices */
    @media (max-width: 768px) {
      .mobile-fallback {
        display: flex;
      }
      #pdf-container {
        display: none;
      }
    }
  </style>
</head>
<body>

  <!-- Fullscreen Desktop Viewer -->
  <div id="pdf-container">
    <iframe 
      src="/deck.pdf#toolbar=1&navpanes=0&scrollbar=1&view=FitH" 
      title="Presentation Deck"
      loading="lazy">
    </iframe>
  </div>

  <!-- Mobile-Friendly Card -->
  <div class="mobile-fallback">
    <h1>Presentation Deck</h1>
    <p>Tap below to view or download the presentation directly on your device.</p>
    <a href="/deck.pdf" class="btn" target="_blank" rel="noopener noreferrer">
      Open Deck (PDF)
    </a>
  </div>

</body>
</html>
