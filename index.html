<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  
  <title>Investor Deck</title>
  <meta name="description" content="View our investor deck." />

  <!-- Open Graph / Social Media Preview -->
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://deck.domain.com" />
  <meta property="og:title" content="SHOGI Systems, Inc. 8-Slide Deck" />
  <meta property="og:description" content="Click to view the investor deck." />

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #1a1a1a;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      color: #ffffff;
    }

    #password-screen {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background: radial-gradient(circle at top, #303030 0%, #121212 58%);
    }

    .password-card {
      width: min(100%, 420px);
      padding: 36px 32px;
      border: 1px solid #444444;
      border-radius: 14px;
      background: #1f1f1f;
      box-shadow: 0 18px 48px rgba(0, 0, 0, 0.35);
      text-align: center;
    }

    .password-card h1 {
      margin-bottom: 10px;
      font-size: 1.7rem;
      font-weight: 650;
    }

    .password-card p {
      margin-bottom: 24px;
      color: #b9b9b9;
      font-size: 0.95rem;
    }

    .password-form {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .password-form input {
      width: 100%;
      padding: 13px 14px;
      border: 1px solid #5a5a5a;
      border-radius: 8px;
      background: #121212;
      color: #ffffff;
      font: inherit;
      outline: none;
    }

    .password-form input:focus {
      border-color: #4d9fff;
      box-shadow: 0 0 0 3px rgba(77, 159, 255, 0.2);
    }

    .password-form button {
      padding: 13px 16px;
      border: 0;
      border-radius: 8px;
      background: #0070f3;
      color: #ffffff;
      font: inherit;
      font-weight: 600;
      cursor: pointer;
    }

    .password-form button:hover {
      background: #005fcf;
    }

    .password-error {
      min-height: 20px;
      margin-top: 14px;
      color: #ff8f8f;
      font-size: 0.9rem;
    }

    #pdf-container,
    .mobile-fallback {
      display: none;
    }

    /* Embedded PDF container */
    #pdf-container {
      width: 100%;
      height: 100%;
      flex-direction: column;
    }

    iframe {
      width: 100%;
      height: 100%;
      border: none;
      flex: 1;
    }

    /* Mobile / Fallback Overlay */
    .mobile-fallback {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: #121212;
      color: #ffffff;
      padding: 32px 24px;
      text-align: center;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 10;
    }

    .mobile-fallback h1 {
      font-size: 1.5rem;
      font-weight: 600;
      margin-bottom: 12px;
    }

    .mobile-fallback p {
      font-size: 0.95rem;
      color: #a0a0a0;
      margin-bottom: 28px;
      max-width: 320px;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background-color: #0070f3;
      color: #ffffff;
      font-weight: 500;
      font-size: 1rem;
      padding: 14px 28px;
      border-radius: 8px;
      text-decoration: none;
      transition: background-color 0.2s ease;
      box-shadow: 0 4px 14px rgba(0, 118, 243, 0.39);
    }

    .btn:hover {
      background-color: #0051b3;
    }

    /* Show mobile fallback on small touch devices */
    @media (max-width: 768px) {
      .mobile-fallback {
        display: flex;
      }
      #pdf-container {
        display: none;
      }
    }
  </style>
</head>
<body>

  <main id="password-screen">
    <section class="password-card" aria-labelledby="password-title">
      <h1 id="password-title">Protected presentation</h1>
      <p>Enter the password to view the deck.</p>
      <form class="password-form" id="password-form">
        <label for="password" class="sr-only">Password</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required autofocus />
        <button type="submit">View deck</button>
      </form>
      <p class="password-error" id="password-error" role="alert" aria-live="polite"></p>
    </section>
  </main>

  <!-- Fullscreen Desktop Viewer -->
  <div id="pdf-container" aria-hidden="true">
    <iframe 
      title="Presentation Deck"
      loading="lazy">
    </iframe>
  </div>

  <!-- Mobile-Friendly Card -->
  <div class="mobile-fallback">
    <h1>Presentation Deck</h1>
    <p>Tap below to view or download the presentation directly on your device.</p>
    <a href="/SHOGI-Seed-Round-Deck.pdf" class="btn" target="_blank" rel="noopener noreferrer">
      Open Deck (PDF)
    </a>
  </div>

  <script>
    const deckPassword = 'SHOGIAuthority!26';
    const passwordScreen = document.getElementById('password-screen');
    const passwordForm = document.getElementById('password-form');
    const passwordInput = document.getElementById('password');
    const passwordError = document.getElementById('password-error');
    const pdfContainer = document.getElementById('pdf-container');
    const pdfFrame = pdfContainer.querySelector('iframe');
    const mobileFallback = document.querySelector('.mobile-fallback');

    passwordForm.addEventListener('submit', (event) => {
      event.preventDefault();

      if (passwordInput.value !== deckPassword) {
        passwordError.textContent = 'Incorrect password.';
        passwordInput.select();
        return;
      }

      passwordError.textContent = '';
      passwordScreen.remove();
      pdfFrame.src = '/deck.pdf#toolbar=1&navpanes=0&scrollbar=1&view=FitH';
      pdfContainer.style.display = 'flex';
      pdfContainer.setAttribute('aria-hidden', 'false');
      mobileFallback.style.display = 'flex';
    });
  </script>

</body>
</html>
